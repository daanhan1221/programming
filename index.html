        // ===== Pyodide: 브라우저에서 실제 CPython 실행 =====
        const PYODIDE_BASE = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';

        let pyodidePromise = null;

        const SANDBOX_RUNNER = String.raw`
import sys, io, json, traceback

def _sandbox_run(code):
    buf = io.StringIO()
    old_out, old_err = sys.stdout, sys.stderr
    sys.stdout = sys.stderr = buf
    err = ""
    try:
        exec(compile(code, "main.py", "exec"), {"__name__": "__main__"})
    except BaseException:
        etype, e, tb = sys.exc_info()
        tb = tb.tb_next if tb else None  # 내부 실행 프레임 숨기기
        err = "".join(traceback.format_exception(etype, e, tb)).rstrip()
    finally:
        sys.stdout, sys.stderr = old_out, old_err
    return json.dumps({"out": buf.getvalue(), "err": err})
`;

        const getPyodide = () => {
            if (pyodidePromise) return pyodidePromise;
            pyodidePromise = new Promise((resolve, reject) => {
                const boot = async () => {
                    try {
                        const py = await window.loadPyodide({ indexURL: PYODIDE_BASE });
                        py.runPython(SANDBOX_RUNNER);
                        pyodideInstance = py;
                        resolve(py);
                    } catch (e) { reject(e); }
                };
                if (window.loadPyodide) { boot(); return; }
                const sc = document.createElement('script');
                sc.src = PYODIDE_BASE + 'pyodide.js';
                sc.onload = boot;
                sc.onerror = () => reject(new Error('Pyodide 스크립트를 불러올 수 없습니다.'));
                document.head.appendChild(sc);
            });
            return pyodidePromise;
        };

            // 샌드박스 에디터: Tab 들여쓰기 / Shift+Tab 내어쓰기 / Enter 자동 들여쓰기
            const handleEditorKeyDown = (e) => {
                const TAB = '    ';
                const ta = e.target;
                const { selectionStart: start, selectionEnd: end, value } = ta;

                const apply = (newValue, selStart, selEnd) => {
                    setSandboxCode(newValue);
                    requestAnimationFrame(() => {
                        ta.selectionStart = selStart;
                        ta.selectionEnd = selEnd;
                    });
                };

                if (e.key === 'Tab') {
                    e.preventDefault();
                    const lineStart = value.lastIndexOf('\n', start - 1) + 1;
                    const multiLine = value.slice(start, end).includes('\n');

                    if (!e.shiftKey && !multiLine) {
                        apply(value.slice(0, start) + TAB + value.slice(end), start + TAB.length, start + TAB.length);
                        return;
                    }

                    // 여러 줄 선택 또는 Shift+Tab: 줄 단위 처리
                    const block = value.slice(lineStart, end);
                    const lines = block.split('\n');
                    let firstDelta = 0, totalDelta = 0;
                    const newLines = lines.map((line, i) => {
                        if (!e.shiftKey) {
                            if (i === 0) firstDelta = TAB.length;
                            totalDelta += TAB.length;
                            return TAB + line;
                        }
                        const m = line.match(/^( {1,4}|\t)/);
                        const removed = m ? m[0].length : 0;
                        if (i === 0) firstDelta = -removed;
                        totalDelta -= removed;
                        return line.slice(removed);
                    });
                    apply(
                        value.slice(0, lineStart) + newLines.join('\n') + value.slice(end),
                        Math.max(lineStart, start + firstDelta),
                        end + totalDelta
                    );
                } else if (e.key === 'Enter' && !e.nativeEvent.isComposing) {
                    e.preventDefault();
                    const lineStart = value.lastIndexOf('\n', start - 1) + 1;
                    const currentLine = value.slice(lineStart, start);
                    let indent = (currentLine.match(/^\s*/) || [''])[0];
                    // 콜론(:)으로 끝나면 한 단계 더 들여쓰기 (파이썬)
                    if (currentLine.trimEnd().endsWith(':')) indent += TAB;
                    const insert = '\n' + indent;
                    apply(value.slice(0, start) + insert + value.slice(end), start + insert.length, start + insert.length);
                }
            };

                                                {!quizSubmitted ? (
                                                    <button
                                                        onClick={() => setQuizSubmitted(true)}
                                                        disabled={Object.keys(userAnswers).length === 0}
                                                        className="px-4 py-1.5 rounded-lg bg-gradient-to-r from-purple-500 to-pink-600 text-slate-950 font-bold text-xs hover:brightness-110 disabled:opacity-40"
                                                    >
                                                        결과 제출
                                                    </button>
                                                ) : (
                                                    <button
                                                        onClick={() => { setUserAnswers({}); setQuizSubmitted(false); setTimer(0); }}
                                                        className="px-4 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs font-bold hover:bg-slate-700"
                                                    >
                                                        다시 풀기
                                                    </button>
                                                )}
                                            </div>
                                        </div>

                                        {/* SCORE REPORT */}
                                        {quizSubmitted && (
                                            <div className="bg-gradient-to-r from-purple-950/80 to-slate-950 border border-purple-500/40 rounded-2xl p-6 text-center space-y-2">
                                                <h4 className="text-lg font-bold text-white">퀴즈 점수 결과</h4>
                                                <p className="text-3xl font-black text-cyan-400">{calculateScore()} / 20 점</p>
                                                <p className="text-xs text-slate-400">정답률: {Math.round((calculateScore() / 20) * 100)}%</p>
                                            </div>
                                        )}

                                        {/* QUIZ FILTER */}
                                        <div className="flex space-x-2 border-b border-slate-800 pb-3">
                                            {[{k:'all',l:'전체'}, {k:'mc',l:'객관식'}, {k:'tf',l:'O/X'}, {k:'code',l:'코드예측'}].map(f => (
                                                <button
                                                    key={f.k}
                                                    onClick={() => setQuizFilter(f.k)}
                                                    className={`px-3 py-1 rounded-lg text-xs font-semibold ${quizFilter === f.k ? 'bg-purple-500/20 text-purple-300 border border-purple-500/40' : 'text-slate-400 bg-slate-950'}`}
                                                >
                                                    {f.l}
                                                </button>
                                            ))}
                                        </div>

                                        {/* QUESTION LIST */}
                                        <div className="space-y-4">
                                            {filteredQuizzes.map((q) => {
                                                const isAnswered = userAnswers[q.id] !== undefined;
                                                const isCorrect = quizSubmitted && userAnswers[q.id] === q.answer;

                                                return (
                                                    <div key={q.id} className={`bg-slate-900/60 border rounded-2xl p-5 space-y-3 ${quizSubmitted ? (isCorrect ? 'border-emerald-500/40' : 'border-rose-500/40') : 'border-slate-800'}`}>
                                                        <div className="flex justify-between items-center text-xs">
                                                            <span className="font-bold font-mono text-cyan-400">Q{q.id}. [{q.type.toUpperCase()}]</span>
                                                            {quizSubmitted && (
                                                                <span className={isCorrect ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}>
                                                                    {isCorrect ? '✓ 정답' : '✗ 오답'}
                                                                </span>
                                                            )}
                                                        </div>

                                                        <p className="text-sm font-semibold text-slate-100 whitespace-pre-line">{q.question}</p>

                                                        {/* OPTIONS */}
                                                        {q.options && (
                                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                                {q.options.map((opt, oIdx) => {
                                                                    const selected = userAnswers[q.id] === oIdx;
                                                                    let btnClass = 'bg-slate-950 border-slate-800 text-slate-300';
                                                                    if (quizSubmitted) {
                                                                        if (oIdx === q.answer) btnClass = 'bg-emerald-500/20 border-emerald-500 text-emerald-300 font-bold';
                                                                        else if (selected) btnClass = 'bg-rose-500/20 border-rose-500 text-rose-300';
                                                                    } else if (selected) {
                                                                        btnClass = 'bg-purple-500/20 border-purple-500 text-purple-300 font-bold';
                                                                    }

                                                                    return (
                                                                        <button
                                                                            key={oIdx}
                                                                            onClick={() => handleSelectAnswer(q.id, oIdx)}
                                                                            className={`text-left p-2.5 rounded-xl border text-xs font-mono transition ${btnClass}`}
                                                                        >
                                                                            {oIdx + 1}. {opt}
                                                                        </button>
                                                                    );
                                                                })}
                                                            </div>
                                                        )}

                                                        {q.type === 'tf' && (
                                                            <div className="grid grid-cols-2 gap-3">
                                                                {[true, false].map((tfVal) => {
                                                                    const selected = userAnswers[q.id] === tfVal;
                                                                    let btnClass = 'bg-slate-950 border-slate-800 text-slate-300';
                                                                    if (quizSubmitted) {
                                                                        if (tfVal === q.answer) btnClass = 'bg-emerald-500/20 border-emerald-500 text-emerald-300 font-bold';
                                                                        else if (selected) btnClass = 'bg-rose-500/20 border-rose-500 text-rose-300';
                                                                    } else if (selected) {
                                                                        btnClass = 'bg-purple-500/20 border-purple-500 text-purple-300 font-bold';
                                                                    }

                                                                    return (
                                                                        <button
                                                                            key={String(tfVal)}
                                                                            onClick={() => handleSelectAnswer(q.id, tfVal)}
                                                                            className={`p-2.5 rounded-xl border text-center font-bold text-xs transition ${btnClass}`}
                                                                        >
                                                                            {tfVal ? 'TRUE (참)' : 'FALSE (거짓)'}
                                                                        </button>
                                                                    );
                                                                })}
                                                            </div>
                                                        )}

                                                        {/* EXPLANATION */}
                                                        <div className="pt-2">
                                                            <button
                                                                onClick={() => setShowExp(prev => ({ ...prev, [q.id]: !prev[q.id] }))}
                                                                className="text-[11px] text-cyan-400 hover:underline"
                                                            >
                                                                {showExp[q.id] ? '해설 접기' : '정답 및 해설 보기'}
                                                            </button>
                                                            {(showExp[q.id] || quizSubmitted) && (
                                                                <p className="mt-2 text-xs bg-slate-950 p-3 rounded-xl border border-slate-800 text-slate-400">
                                                                    💡 {q.exp}
                                                                </p>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {/* TAB 3: SANDBOX */}
                                {activeTab === 'sandbox' && (
                                    <div className="space-y-4">
                                        <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex justify-between items-center">
                                            <h3 className="text-sm font-bold text-white">파이썬 라이브 연산 시뮬레이터</h3>
                                            <button
                                                onClick={handleRunCode}
                                                disabled={isExecuting}
                                                className="px-4 py-1.5 rounded-lg bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 text-xs font-bold hover:brightness-110"
                                            >
                                                {isExecuting ? '실행 중...' : '코드 실행 (RUN)'}
                                            </button>
                                        </div>

                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                            <div className="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden flex flex-col h-80">
                                                <div className="bg-slate-900 px-4 py-2 border-b border-slate-800 text-xs font-mono text-slate-400">
                                                    main.py
                                                </div>
                                                <textarea
                                                    value={sandboxCode}
                                                    onChange={(e) => setSandboxCode(e.target.value)}
                                                    onKeyDown={handleEditorKeyDown}
                                                    className="w-full flex-1 p-4 bg-slate-950 text-emerald-400 font-mono text-xs resize-none focus:outline-none"
                                                    spellCheck="false"
                                                ></textarea>
                                            </div>

                                            <div className="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden flex flex-col h-80">
                                                <div className="bg-slate-900 px-4 py-2 border-b border-slate-800 text-xs font-mono text-slate-400">
                                                    Terminal Console
                                                </div>
                                                <div className="w-full flex-1 p-4 font-mono text-xs text-cyan-300 overflow-y-auto whitespace-pre-wrap">
                                                    {sandboxOutput || "[코드 실행 버튼을 눌러 연산 결과를 확인하세요]"}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                            </main>
                        </div>
                    </div>

                    {/* FOOTER */}
                    <footer className="border-t border-slate-800 bg-slate-950 py-4 text-center text-xs text-slate-500 font-mono">
                        Copyright 2026. HDA All rights reserved.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
